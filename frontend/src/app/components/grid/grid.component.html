<div class="grid-container">  <div class="grid-header">    <h1> 
Items Grid with CDK Virtual Scrolling</h1> 
    <input      type="text"      placeholder="Search by name, email, phone or address..."      (keyup)="onSearchChange($event)"      class="search-input"    /> 
  </div> 
  <div *ngIf="isLoading" class="loading"> 
Loading...</div> 
  <!-- Sort Options --> 
  <div class="sort-controls" *ngIf="!isLoading"> 
    <label> 
Sort by:</label> 
    <button       *ngFor="let col of ['id', 'name', 'email', 'phone', 'address', 'createdAt']"      class="sort-btn"      [class.active]="sortBy === col"      (click)="onSortChange(col)"> 
      {{ col | titlecase }}      <span *ngIf="sortBy === col" class="sort-arrow"> 
{{ sortOrder === 'asc' ? '↑' : '↓' }}</span> 
    </button> 
  </div> 
  <!-- CDK Virtual Scrolling Table --> 
  <div class="virtual-scroll-container" *ngIf="!isLoading && items.length > 
 0"> 
    <div class="table-header"> 
      <div class="header-row"> 
        <div class="header-cell" style="width: 5%;"> ID</div> 
        <div class="header-cell" style="width: 20%;"> Name</div> 
        <div class="header-cell" style="width: 25%;"> Email</div> 
        <div class="header-cell" style="width: 15%;"> Phone</div> 
        <div class="header-cell" style="width: 20%;"> Address</div> 
        <div class="header-cell" style="width: 15%;"> Created At</div> 
        <div class="header-cell" style="width: 10%;"> Actions</div> 
      </div> 
    </div> 
    <cdk-virtual-scroll-viewport [itemSize]="itemHeight" class="viewport"> 
      <div         *cdkVirtualFor="let item of items; trackBy: trackByIndex"        class="row"        [@.disabled]="true"> 
        <div class="cell" style="width: 5%;"> {{ item.id }}</div> 
        <div class="cell" style="width: 20%;"> {{ item.name }}</div> 
        <div class="cell" style="width: 25%;"> {{ item.email }}</div> 
        <div class="cell" style="width: 15%;"> {{ item.phone }}</div> 
        <div class="cell" style="width: 20%;">{{ item.address }}</div> 
        <div class="cell" style="width: 15%;">{{ item.createdAt | date: 'short' }}</div> 
        <div class="cell actions-cell" style="width: 10%;"> 
          <button mat-icon-button color="primary" (click)="editItem(item)" title="Edit"> 
            <mat-icon> edit</mat-icon> 
          </button> 
          <button mat-icon-button color="warn" (click)="deleteItem(item.id)" title="Delete"> 
            <mat-icon> delete</mat-icon> 
          </button> 
        </div> 
      </div> 
    </cdk-virtual-scroll-viewport> 
  </div> 
  <!-- Empty State --> 
  <div class="empty-state" *ngIf="!isLoading && items.length === 0"> 
    <p> 
No items found</p> 
  </div> 
  <!-- Pagination --> 
  <mat-paginator    [length]="totalItems"    [pageSize]="pageSize"    [pageSizeOptions]="[5, 10, 25, 50]"    (page)="onPageChange($event)"    class="paginator"    *ngIf="!isLoading"> 
  </mat-paginator> 
</div>
