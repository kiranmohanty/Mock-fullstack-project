<div class="grid-container">
  <input 
    type="text" 
    placeholder="Search grid..." 
    (input)="searchTerm.set($any($event.target).value)" 
  />

  <!-- Modern Built-in Conditional Block -->
  @if (isLoading()) {
    <div class="spinner">Loading records from EF Core...</div>
  } @else {
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Modern Built-in Loop with Mandatory 'track' expression -->
        @for (item of filteredData(); track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>
              <button (click)="deleteItem(item.id)">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3">No grid rows found matching criteria.</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
